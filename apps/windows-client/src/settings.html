<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-PLACEHOLDER'"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Подключение к BB</title>
<style>
:root{color-scheme:light dark;font:15px 'Segoe UI',sans-serif}body{margin:0;padding:32px;background:Canvas;color:CanvasText}h1{font-size:24px;margin:0 0 12px}p{line-height:1.5;color:GrayText}label{display:block;margin:18px 0 6px}input,select,button{box-sizing:border-box;font:inherit;border:1px solid GrayText;border-radius:6px;padding:10px;background:Canvas;color:CanvasText}input,select{width:100%}button{margin-top:24px;background:Highlight;color:HighlightText;border-color:Highlight;cursor:pointer;width:100%}button:disabled{opacity:.6;cursor:wait}.row{display:flex;gap:16px}.row>div{flex:1}[hidden]{display:none!important}#error{color:light-dark(#b02020,#ff9b9b);white-space:pre-wrap}
</style></head><body><h1>Подключение к BB</h1><p>Выберите сервер. BB запомнит подключение и откроет его при следующем запуске.</p>
<form id="form"><label for="kind">Способ подключения</label><select id="kind"><option value="ssh">SSH-туннель</option><option value="direct">Адрес сервера</option></select>
<div id="ssh"><label for="profile">SSH-профиль Windows</label><input id="profile" value="nuc-clawd" required><div class="row"><div><label for="localPort">Локальный порт</label><input id="localPort" type="number" min="1024" max="65535" value="38896" required></div><div><label for="remotePort">Порт BB на сервере</label><input id="remotePort" type="number" min="1" max="65535" value="38886" required></div></div><p>Используется конфигурация OpenSSH текущего пользователя Windows.</p></div>
<div id="direct" hidden><label for="url">Адрес BB</label><input id="url" type="url" placeholder="https://bb.example.com/"></div><label for="distribution">WSL-дистрибутив для управления браузером</label><input id="distribution" placeholder="По умолчанию"><label for="browserServerUrl">Адрес сервера в настройках WSL-демона</label><input id="browserServerUrl" type="url" placeholder="Тот же адрес; для SSH укажите исходный адрес сервера"><p id="error" role="alert"></p><button id="save">Сохранить и подключиться</button></form>
<script>
const byId=id=>document.getElementById(id);
function mode(){const ssh=byId('kind').value==='ssh';byId('ssh').hidden=!ssh;byId('direct').hidden=ssh;for(const id of ['profile','localPort','remotePort'])byId(id).disabled=!ssh;byId('url').disabled=ssh;byId('url').required=!ssh;}
byId('kind').addEventListener('change',mode);
window.bbConnection.read().then(config=>{byId('distribution').value=config.browserHost?.distribution??'';byId('browserServerUrl').value=config.browserHost?.serverUrl??'';byId('kind').value=config.kind;if(config.kind==='ssh'){byId('profile').value=config.profile;byId('localPort').value=config.localPort;byId('remotePort').value=config.remotePort;}else byId('url').value=config.url;mode();}).catch(error=>{byId('error').textContent=error.message;});
byId('form').addEventListener('submit',async event=>{event.preventDefault();byId('save').disabled=true;byId('error').textContent='';const kind=byId('kind').value;try{const payload=kind==='ssh'?{kind,profile:byId('profile').value.trim(),localPort:Number(byId('localPort').value),remotePort:Number(byId('remotePort').value)}:{kind,url:byId('url').value.trim()};const distribution=byId('distribution').value.trim();const serverUrl=byId('browserServerUrl').value.trim();if(distribution||serverUrl)payload.browserHost={...(distribution?{distribution}:{}),...(serverUrl?{serverUrl}:{})};const result=await window.bbConnection.save(payload);if(result.error)throw new Error(result.error);}catch(error){byId('error').textContent=error.message;}finally{byId('save').disabled=false;}});
mode();
</script></body></html>

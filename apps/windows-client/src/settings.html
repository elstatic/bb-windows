<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-PLACEHOLDER'"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Подключение к BB</title>
<style>
:root{color-scheme:light dark;font:15px 'Segoe UI',sans-serif}body{margin:0;padding:32px;background:Canvas;color:CanvasText}h1{font-size:24px;margin:0 0 12px}p{line-height:1.5;color:GrayText}label{display:block;margin:18px 0 6px}input,select,textarea,button{box-sizing:border-box;font:inherit;border:1px solid GrayText;border-radius:6px;padding:10px;background:Canvas;color:CanvasText}input,select,textarea{width:100%}button{margin-top:24px;background:Highlight;color:HighlightText;border-color:Highlight;cursor:pointer;width:100%}button:disabled{opacity:.6;cursor:wait}.row{display:flex;gap:16px}.row>div{flex:1}[hidden]{display:none!important}#error{color:light-dark(#b02020,#ff9b9b);white-space:pre-wrap}
</style></head><body><h1>Подключение к BB</h1><p>Выберите сервер. BB запомнит подключение и откроет его при следующем запуске.</p>
<form id="form"><label for="kind">Способ подключения</label><select id="kind"><option value="connect">BB Connect</option><option value="ssh">SSH-туннель</option><option value="direct">Адрес сервера</option></select>
<div id="connect" hidden><label for="connectBaseUrl">Сервис BB Connect</label><input id="connectBaseUrl" type="url" value="https://getbb.app/"><div class="row"><button id="signIn" type="button">Войти в аккаунт</button><button id="refresh" type="button">Обновить список</button></div><p id="accountStatus"></p><label for="connectServer">Сервер аккаунта</label><select id="connectServer"><option value="">Войдите, чтобы выбрать сервер</option></select><details><summary>Подключить устройство по коду</summary><p>Код можно получить в своём BB командой <code>bb connect machine-code</code>. Вставьте код или JSON целиком.</p><input id="pairCode" type="password" autocomplete="off"><button id="pair" type="button">Подключить по коду</button></details><button id="bootstrap" type="button">Подключить текущий сервер через BB Connect</button><button id="logout" type="button">Выйти из BB Connect</button></div><div id="ssh"><label for="profile">SSH-профиль Windows</label><input id="profile" value="nuc-clawd" required><div class="row"><div><label for="localPort">Локальный порт</label><input id="localPort" type="number" min="1024" max="65535" value="38896" required></div><div><label for="remotePort">Порт BB на сервере</label><input id="remotePort" type="number" min="1" max="65535" value="38886" required></div></div><p>Используется конфигурация OpenSSH текущего пользователя Windows.</p></div>
<div id="direct" hidden><label for="url">Адрес BB</label><input id="url" type="url" placeholder="https://bb.example.com/"></div><label for="distribution">WSL-дистрибутив для управления браузером</label><input id="distribution" placeholder="По умолчанию"><label for="browserServerUrl">Адрес сервера в настройках WSL-демона</label><input id="browserServerUrl" type="url" placeholder="Тот же адрес; для SSH укажите исходный адрес сервера"><p id="error" role="alert"></p><button id="save">Сохранить и подключиться</button></form>
<script>
const byId=id=>document.getElementById(id);
let servers=[];
let selectedHandle='';
let listGeneration=0;
function mode(){const kind=byId('kind').value;byId('ssh').hidden=kind!=='ssh';byId('direct').hidden=kind!=='direct';byId('connect').hidden=kind!=='connect';for(const id of ['profile','localPort','remotePort'])byId(id).disabled=kind!=='ssh';byId('url').disabled=kind!=='direct';byId('url').required=kind==='direct';byId('connectBaseUrl').disabled=kind!=='connect';byId('connectServer').disabled=kind!=='connect';byId('connectServer').required=kind==='connect';}
async function action(payload){const result=await window.bbConnection.connect(payload);if(result.error)throw new Error(result.error);return result;}
async function listServers(){const attempt=++listGeneration;const baseUrl=byId('connectBaseUrl').value.trim();const result=await action({action:'list',baseUrl});if(attempt!==listGeneration||baseUrl!==byId('connectBaseUrl').value.trim())return;servers=result.servers;byId('accountStatus').textContent=result.signedIn?(servers.length?'Выберите сервер.':'В аккаунте пока нет серверов. Подключите свой BB к BB Connect.'):'Войдите в аккаунт или подключите устройство по коду.';const select=byId('connectServer');select.replaceChildren();for(const server of servers){const option=document.createElement('option');option.value=server.handle;option.textContent=server.name+(server.live?'':' — не в сети');select.append(option);}if(!servers.length){const option=document.createElement('option');option.value='';option.textContent='Нет доступных серверов';select.append(option);}if(servers.some(server=>server.handle===selectedHandle))select.value=selectedHandle;}
async function run(task){byId('error').textContent='';try{await task();}catch(error){byId('error').textContent=error.message;}}
byId('kind').addEventListener('change',()=>{mode();if(byId('kind').value==='connect')void run(listServers);});
byId('connectBaseUrl').addEventListener('change',()=>{selectedHandle='';void run(listServers);});
byId('connectServer').addEventListener('change',()=>{selectedHandle=byId('connectServer').value;});
byId('signIn').addEventListener('click',()=>run(()=>action({action:'sign-in',baseUrl:byId('connectBaseUrl').value.trim()})));
byId('refresh').addEventListener('click',()=>run(listServers));
byId('pair').addEventListener('click',()=>run(async()=>{await action({action:'pair',baseUrl:byId('connectBaseUrl').value.trim(),code:byId('pairCode').value.trim()});byId('pairCode').value='';await listServers();}));
byId('bootstrap').addEventListener('click',()=>run(()=>action({action:'bootstrap'})));
byId('logout').addEventListener('click',()=>run(async()=>{await action({action:'logout',baseUrl:byId('connectBaseUrl').value.trim()});await listServers();}));
window.bbConnection.onConnectChanged(()=>{if(byId('kind').value==='connect')void run(listServers);});
window.bbConnection.read().then(config=>{byId('bootstrap').disabled=!config||config.kind==='connect';if(config){byId('distribution').value=config.browserHost?.distribution??'';byId('browserServerUrl').value=config.browserHost?.serverUrl??'';byId('kind').value=config.kind;if(config.kind==='ssh'){byId('profile').value=config.profile;byId('localPort').value=config.localPort;byId('remotePort').value=config.remotePort;}else if(config.kind==='direct')byId('url').value=config.url;else{byId('connectBaseUrl').value=config.baseUrl;selectedHandle=config.handle;}}mode();if(byId('kind').value==='connect')void run(listServers);}).catch(error=>{byId('error').textContent=error.message;});
byId('form').addEventListener('submit',async event=>{event.preventDefault();byId('save').disabled=true;byId('error').textContent='';const kind=byId('kind').value;try{let payload;if(kind==='ssh')payload={kind,profile:byId('profile').value.trim(),localPort:Number(byId('localPort').value),remotePort:Number(byId('remotePort').value)};else if(kind==='direct')payload={kind,url:byId('url').value.trim()};else{const server=servers.find(server=>server.handle===byId('connectServer').value);if(!server)throw new Error('Выберите сервер BB Connect.');payload={kind,baseUrl:byId('connectBaseUrl').value.trim(),handle:server.handle,name:server.name};}const distribution=byId('distribution').value.trim();const serverUrl=byId('browserServerUrl').value.trim();if(distribution||serverUrl)payload.browserHost={...(distribution?{distribution}:{}),...(serverUrl?{serverUrl}:{})};const result=await window.bbConnection.save(payload);if(result.error)throw new Error(result.error);}catch(error){byId('error').textContent=error.message;}finally{byId('save').disabled=false;}});
mode();
</script></body></html>
